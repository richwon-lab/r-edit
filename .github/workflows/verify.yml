name: Local-contract checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      windows_build:
        description: Windows 앱 빌드도 실행
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 공개 저장소의 표준 러너는 무료. 비공개는 예산 확인 후 명시적으로 활성화한다.
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_CI == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      # setup-dart가 덮어쓴 PUB_CACHE를 이후 FVM·검증 단계에서 함께 사용한다.
      - name: Configure runner cache paths
        shell: bash
        run: |
          printf '%s\n' "PUB_CACHE=$RUNNER_TEMP/pub-cache" "FVM_CACHE_PATH=$RUNNER_TEMP/fvm" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install project SDK through FVM
        run: |
          dart pub global activate fvm 4.3.2
          fvm install
          fvm use --force --skip-pub-get
      - name: Generate, analyze, test and verify consumers
        run: fvm dart tool/verify.dart
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_build && (!github.event.repository.private || vars.ENABLE_PRIVATE_CI == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      - name: Configure runner cache paths
        shell: pwsh
        run: |
          $pubCache = Join-Path $env:RUNNER_TEMP 'pub-cache'
          $fvmCache = Join-Path $env:RUNNER_TEMP 'fvm'
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FVM_CACHE_PATH=$fvmCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Join-Path $pubCache 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: dart pub global activate fvm 4.3.2
      - run: fvm install
      - run: fvm use --force --skip-pub-get
      - run: fvm dart tool/verify.dart --windows
